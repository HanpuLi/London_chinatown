name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-check:
    name: repository-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Repository, site and data invariants
        run: python tools/check_repository.py

  r-syntax:
    name: r-syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
      - name: Parse R sources
        shell: bash
        run: |
          set -euo pipefail
          for f in scripts/*.R; do Rscript -e "parse(file=\"$f\")" >/dev/null; done
          bash -n scripts/run_pipeline.sh

  data-reproduction:
    name: data-reproduction
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
      - name: Install classification dependency
        run: Rscript -e 'install.packages("dplyr", repos="https://cloud.r-project.org")'
      - name: Reproduce classification baseline
        run: |
          Rscript scripts/data_cleaning_script.R
          Rscript scripts/cuisine_fix_script.R
          python3 tools/check_reproduction.py build/food_data.csv
