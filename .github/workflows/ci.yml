name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Repository and data invariants
        run: python tools/check_repository.py

  r-syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: r-lib/actions/setup-r@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2
      - name: Parse R sources
        shell: bash
        run: |
          set -euo pipefail
          for f in scripts/*.R; do Rscript -e "parse(file=\"$f\")" >/dev/null; done
          zsh -n scripts/run_pipeline.sh

  data-reproduction:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: r-lib/actions/setup-r@465b7d8e732ca3921382b1674c59bada9cbf3399 # v2
      - name: Install classification dependency
        run: Rscript -e 'install.packages("dplyr", repos="https://cloud.r-project.org")'
      - name: Reproduce classification baseline
        run: |
          Rscript scripts/data_cleaning_script.R
          Rscript scripts/cuisine_fix_script.R
          python3 tools/check_reproduction.py build/food_data.csv
